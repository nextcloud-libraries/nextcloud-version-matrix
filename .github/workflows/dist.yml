name: Check dist is up-to-date

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check_dist:
    runs-on: ubuntu-latest
    name: Check dist is up-to-date
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Check for changes
      run: |
        if [ -n "$(git status --porcelain dist)" ]; then
          git status dist
          git diff dist
          echo "::error::dist is outdated, run 'npm ci && npm run build' and commit the result"
          exit 1
        fi
